<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupos Contables</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="window-container">
        <header>GRUPOS CONTABLES</header>
        
        <div class="sub-header">
            <div>UNIDAD: UFV 2026</div>
        </div>

        <div class="main-title">GRUPO CONTABLE</div>

        <main>
            <div class="form-container">
                
                <div class="left-inputs">
                    <div>Grupo</div>
                    <input type="text" id="input-grupo" class="center-text" value="" readonly>
                    
                    <div>Vida Util</div>
                    <input type="text" id="input-vida-util" class="center-text" value="" readonly>
                </div>

                <div class="right-inputs">
                    <div>Nombre</div>
                    <select id="select-nombre">
                        </select>

                    <div style="padding-top: 5px;">Observaciones</div>
                    <textarea id="txt-observaciones"></textarea>

                    <div class="checkbox-container">
                        <div class="checkbox-item">
                            <label for="chk-deprecia">Deprecia</label>
                            <input type="checkbox" id="chk-deprecia" checked>
                        </div>
                        <div class="checkbox-item">
                            <label for="chk-actualiza">Actualiza</label>
                            <input type="checkbox" id="chk-actualiza" checked>
                        </div>
                    </div>
                </div>

            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>CODIGO</th>
                            <th>NOMBRE AUXILIAR</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td></td><td></td></tr>
                        <tr><td></td><td></td></tr>
                        <tr><td></td><td></td></tr>
                        <tr><td></td><td></td></tr>
                        <tr><td></td><td></td></tr>
                        <tr><td></td><td></td></tr>
                        <tr><td></td><td></td></tr>
                        <tr><td></td><td></td></tr>
                    </tbody>
                </table>
            </div>

            <div class="button-bar">
                <button class="btn">Nuevo</button>
                <button class="btn">Modificar</button>
                <button class="btn disabled" disabled>Guardar</button>
                <button class="btn">Eliminar</button>
                <button class="btn disabled" disabled>Deshacer</button>
                <button class="btn">Salir</button>
            </div>
        </main>
    </div>

    <!-- Popup para Cuenta Partida -->
    <div class="popup-overlay" id="popup-ctapar-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div class="popup-content" style="background-color: #f0f0f0; border: 2px solid #7a96df; border-radius: 0; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); width: 450px; max-height: 90vh; overflow-y: auto;">
            <div class="popup-header" style="background: linear-gradient(to right, #99b4d1, #b8d0e9); padding: 5px 10px; color: #000; font-size: 13px; font-weight: bold; border-bottom: 1px solid #6384a3;">Cuenta Partida</div>
            <div class="popup-title" style="background: linear-gradient(to bottom, #3372a5, #1b3750); color: white; text-align: center; padding: 10px; font-size: 16px; font-weight: bold; letter-spacing: 1px;">CUENTA PARTIDA</div>
            <div class="popup-body" style="padding: 25px;">
                <div class="popup-form-box" style="border: 1px solid #999999; background-color: #f7f9fc; padding: 25px 30px; display: grid; grid-template-columns: 120px 1fr; gap: 16px 15px; align-items: center;">
                    <div class="popup-label-text" style="font-size: 14px; color: #104e8b; font-weight: bold; text-align: left;">Codcont:</div>
                    <div>
                        <input type="text" class="popup-input" id="popup-ctapar-codcont" value="" style="background-color: #ffffff; border: 1px solid #7f9db9; padding: 4px 6px; font-size: 14px; outline: none; color: #000; width: 100%;">
                    </div>

                    <div class="popup-label-text" style="font-size: 14px; color: #104e8b; font-weight: bold; text-align: left;">Descripción:</div>
                    <div>
                        <input type="text" class="popup-input" id="popup-ctapar-descripcion" value="" style="background-color: #ffffff; border: 1px solid #7f9db9; padding: 4px 6px; font-size: 14px; outline: none; color: #000; width: 100%;">
                    </div>
                </div>

                <div class="popup-footer" style="margin-top: 15px; border: 1px solid #d4d4d4; background-color: #eaeaea; padding: 8px 20px; display: flex; justify-content: flex-end; gap: 12px;">
                    <button class="btn" id="popup-ctapar-grabar" style="padding: 5px 20px;">Grabar</button>
                    <button class="btn" id="popup-ctapar-salir" style="padding: 5px 20px;">Salir</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URLs de la API
        const API_BASE_URL = "https://fuerza-g-grupo-1-uy0x.onrender.com";
        const API_GRUPOS = `${API_BASE_URL}/api/objgasto`;
        const API_CTA_PAR = `${API_BASE_URL}/api/Cta_par`;

        const selectNombre = document.getElementById("select-nombre");
        const inputGrupo = document.getElementById("input-grupo");
        const inputVidaUtil = document.getElementById("input-vida-util");
        const txtObservaciones = document.getElementById("txt-observaciones");
        const chkDeprecia = document.getElementById("chk-deprecia");
        const chkActualiza = document.getElementById("chk-actualiza");

        // Elementos del popup Cta_par
        const popupCtaParOverlay = document.getElementById("popup-ctapar-overlay");
        const popupCtaParCodcont = document.getElementById("popup-ctapar-codcont");
        const popupCtaParDescripcion = document.getElementById("popup-ctapar-descripcion");
        const btnPopupCtaParGrabar = document.getElementById("popup-ctapar-grabar");
        const btnPopupCtaParSalir = document.getElementById("popup-ctapar-salir");

        let ctaPar = [];

        // Funciones para Cuenta Partida
        async function cargarCtaPar() {
            try {
                const response = await fetch(API_CTA_PAR);
                if (!response.ok) throw new Error("Error al cargar cuentas partida");
                ctaPar = await response.json();
            } catch (error) {
                console.error("Error al cargar cuentas partida:", error);
            }
        }

        function mostrarPopupCtaPar() {
            popupCtaParOverlay.style.display = "flex";
        }

        function ocultarPopupCtaPar() {
            popupCtaParOverlay.style.display = "none";
        }

        async function grabarPopupCtaPar() {
            const codcont = popupCtaParCodcont.value.trim();
            const descripcion = popupCtaParDescripcion.value.trim();

            if (!codcont || !descripcion) {
                alert("Por favor complete todos los campos");
                return;
            }

            const apiData = {
                Codcont: codcont,
                descripcion: descripcion
            };

            try {
                const response = await fetch(API_CTA_PAR, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(apiData)
                });
                if (!response.ok) throw new Error("Error al crear cuenta partida");
                alert("Cuenta partida creada exitosamente");
                await cargarCtaPar();
                ocultarPopupCtaPar();
            } catch (error) {
                console.error("Error al guardar cuenta partida:", error);
                alert("Error: No se pudo guardar en la API");
            }
        }

        // Event listeners para popup Cta_par
        btnPopupCtaParGrabar.addEventListener("click", grabarPopupCtaPar);
        btnPopupCtaParSalir.addEventListener("click", ocultarPopupCtaPar);

        // Cerrar popup al hacer clic fuera
        popupCtaParOverlay.addEventListener("click", (e) => {
            if (e.target === popupCtaParOverlay) ocultarPopupCtaPar();
        });

        // Botones
        const btnNuevo = document.querySelector(".button-bar button:nth-child(1)");
        const btnModificar = document.querySelector(".button-bar button:nth-child(2)");
        const btnGuardar = document.querySelector(".button-bar button:nth-child(3)");
        const btnEliminar = document.querySelector(".button-bar button:nth-child(4)");
        const btnDeshacer = document.querySelector(".button-bar button:nth-child(5)");
        const btnSalir = document.querySelector(".button-bar button:nth-child(6)");

        let gruposContables = [];
        let modoEdicion = false;
        let grupoOriginal = null;

        // Función para cargar los grupos desde la API
        async function cargarGrupos() {
            try {
                const response = await fetch(API_GRUPOS);
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                const rawData = await response.json();
                
                // Mapear datos del nuevo API a la estructura esperada
                // ObjGasto schema: {gestion, partida, descrip}
                if (rawData.length > 0) {
                    gruposContables = rawData.map(item => ({
                        idGrupo: item.gestion || item.partida || 1,
                        nombreGrupo: item.descrip || "GRUPO CONTABLE",
                        vidaUtil: 10,
                        deprecia: true,
                        actualiza: true,
                        observaciones: ""
                    }));
                } else {
                    gruposContables = [];
                }
                
                inicializarSelector();
            } catch (error) {
                console.error("Error al cargar grupos:", error);
                alert("Error: No se pudo conectar con la API. Verifique la conexión.");
                gruposContables = [];
                inicializarSelector();
            }
        }

        // Función para cargar los datos en el selector
        function inicializarSelector() {
            selectNombre.innerHTML = "";
            gruposContables.forEach((item) => {
                let option = document.createElement("option");
                option.value = item.idGrupo;
                option.textContent = item.nombreGrupo;
                selectNombre.appendChild(option);
            });

            // Seleccionar por defecto el primer grupo
            if (gruposContables.length > 0) {
                selectNombre.value = gruposContables[0].idGrupo;
                actualizarCampos(gruposContables[0].idGrupo);
            }
        }

        // Función para actualizar Grupo y Vida útil según la selección
        function actualizarCampos(idGrupo) {
            const itemSeleccionado = gruposContables.find(item => item.idGrupo == idGrupo);
            if (itemSeleccionado) {
                inputGrupo.value = itemSeleccionado.idGrupo;
                inputVidaUtil.value = itemSeleccionado.vidaUtil;
                txtObservaciones.value = itemSeleccionado.observaciones || "";
                chkDeprecia.checked = itemSeleccionado.deprecia;
                chkActualiza.checked = itemSeleccionado.actualiza;
            }
        }

        // Función Nuevo
        function nuevoGrupo() {
            modoEdicion = true;
            grupoOriginal = null;
            
            // Limpiar campos
            inputGrupo.value = "";
            inputVidaUtil.value = "";
            txtObservaciones.value = "";
            chkDeprecia.checked = true;
            chkActualiza.checked = true;
            
            // Habilitar/deshabilitar botones
            btnNuevo.disabled = true;
            btnModificar.disabled = true;
            btnGuardar.disabled = false;
            btnGuardar.classList.remove("disabled");
            btnEliminar.disabled = true;
            btnDeshacer.disabled = false;
            btnDeshacer.classList.remove("disabled");
            
            // Habilitar inputs para edición
            inputVidaUtil.readOnly = false;
            txtObservaciones.readOnly = false;
        }

        // Función Modificar
        function modificarGrupo() {
            modoEdicion = true;
            const idSeleccionado = parseInt(selectNombre.value);
            grupoOriginal = gruposContables.find(g => g.idGrupo === idSeleccionado);
            
            // Habilitar/deshabilitar botones
            btnNuevo.disabled = true;
            btnModificar.disabled = true;
            btnGuardar.disabled = false;
            btnGuardar.classList.remove("disabled");
            btnEliminar.disabled = true;
            btnDeshacer.disabled = false;
            btnDeshacer.classList.remove("disabled");
            
            // Habilitar inputs para edición
            inputVidaUtil.readOnly = false;
            txtObservaciones.readOnly = false;
        }

        // Función Guardar
        async function guardarGrupo() {
            const idGrupo = inputGrupo.value ? parseInt(inputGrupo.value) : (gruposContables.length > 0 ? Math.max(...gruposContables.map(g => g.idGrupo)) + 1 : 1);
            const nombreGrupo = selectNombre.options[selectNombre.selectedIndex]?.textContent || "NUEVO GRUPO";
            
            // Mapear datos al esquema del API (ObjGasto)
            const apiData = {
                gestion: idGrupo,
                partida: idGrupo.toString(),
                descrip: nombreGrupo
            };
            
            const nuevoGrupo = {
                idGrupo: idGrupo,
                nombreGrupo: nombreGrupo,
                vidaUtil: parseInt(inputVidaUtil.value),
                deprecia: chkDeprecia.checked,
                actualiza: chkActualiza.checked,
                observaciones: txtObservaciones.value
            };

            try {
                if (grupoOriginal) {
                    // Actualizar existente (PUT) usando posición
                    const posicion = gruposContables.findIndex(g => g.idGrupo === idGrupo);
                    if (posicion >= 0) {
                        const response = await fetch(`${API_GRUPOS}/${posicion}`, {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(apiData)
                        });
                        if (!response.ok) throw new Error("Error al actualizar");
                    }
                } else {
                    // Crear nuevo (POST)
                    const response = await fetch(API_GRUPOS, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(apiData)
                    });
                    if (!response.ok) throw new Error("Error al crear");
                }
                
                // Actualizar datos locales
                const index = gruposContables.findIndex(g => g.idGrupo === idGrupo);
                if (index >= 0) {
                    gruposContables[index] = nuevoGrupo;
                } else {
                    gruposContables.push(nuevoGrupo);
                }
                
                inicializarSelector();
                restaurarEstado();
                alert("Guardado exitosamente");
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Error: No se pudo guardar en la API. Verifique la conexión.");
            }
        }

        // Función Eliminar
        async function eliminarGrupo() {
            const idSeleccionado = parseInt(selectNombre.value);
            if (!confirm("¿Está seguro de eliminar este grupo?")) return;

            try {
                // Usar posición (índice) en lugar de ID para DELETE
                const posicion = gruposContables.findIndex(g => g.idGrupo === idSeleccionado);
                if (posicion >= 0) {
                    const response = await fetch(`${API_GRUPOS}/${posicion}`, {
                        method: "DELETE"
                    });
                    if (!response.ok) throw new Error("Error al eliminar");
                }
                
                gruposContables = gruposContables.filter(g => g.idGrupo !== idSeleccionado);
                inicializarSelector();
                alert("Eliminado exitosamente");
            } catch (error) {
                console.error("Error al eliminar:", error);
                alert("Error: No se pudo eliminar en la API. Verifique la conexión.");
            }
        }

        // Función Deshacer
        function deshacer() {
            restaurarEstado();
            if (grupoOriginal) {
                actualizarCampos(grupoOriginal.idGrupo);
            }
        }

        // Función Salir
        function salir() {
            if (modoEdicion) {
                if (confirm("Hay cambios sin guardar. ¿Desea salir?")) {
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'close-modal' }, '*');
                    } else {
                        window.close();
                    }
                }
            } else {
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'close-modal' }, '*');
                } else {
                    window.close();
                }
            }
        }

        // Restaurar estado normal de botones
        function restaurarEstado() {
            modoEdicion = false;
            grupoOriginal = null;
            
            btnNuevo.disabled = false;
            btnModificar.disabled = false;
            btnGuardar.disabled = true;
            btnGuardar.classList.add("disabled");
            btnEliminar.disabled = false;
            btnDeshacer.disabled = true;
            btnDeshacer.classList.add("disabled");
            
            inputVidaUtil.readOnly = true;
            txtObservaciones.readOnly = true;
        }

        // Event listeners
        selectNombre.addEventListener("change", function() {
            actualizarCampos(this.value);
        });

        btnNuevo.addEventListener("click", nuevoGrupo);
        btnModificar.addEventListener("click", modificarGrupo);
        btnGuardar.addEventListener("click", guardarGrupo);
        btnEliminar.addEventListener("click", eliminarGrupo);
        btnDeshacer.addEventListener("click", deshacer);
        btnSalir.addEventListener("click", salir);

        // Ejecutar al cargar el documento
        document.addEventListener("DOMContentLoaded", () => {
            cargarGrupos();
            cargarCtaPar();
        });
    </script>
    <script src="../../../../js/iframe-resize.js"></script>
    <script src="../../../../js/modal-close.js"></script>
</body>
</html>
