<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Recursos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="window-container">
        <header>ADMINISTRACION DE RECURSOS</header>
        <div class="main-title">ADMINISTRACION DE RECURSOS</div>

        <main>
            <section>
                <div class="control-group">
                    <span class="control-group-title">CIERRE DE GESTION</span>
                    <div class="button-stack">
                        <button class="btn-system"><u>C</u>errar Gestión</button>
                        <button class="btn-system">Ca<u>m</u>biar Gestión</button>
                    </div>
                </div>

                <div class="control-group" style="margin-bottom: 0;">
                    <div class="button-stack">
                        <button class="btn-system">Importar/Exportar</button>
                        <button class="btn-system"><u>I</u>ndices UFV</button>
                        <button class="btn-system">Seguridad</button>
                        <button class="btn-system">Re-indexar</button>
                        <button class="btn-system">Migrador</button>
                    </div>
                </div>
            </section>

            <section class="display-section">
                <div class="display-box">2026</div>
                
                <div class="status-box">.F.</div>

                <div class="image-container">
                    <img src="../../../../assets/img/administradores.png" alt="Administración del Sistema">
                </div>
            </section>

            <div class="footer-bar">
                <button class="btn-salir">Sal<u>i</u>r</button>
            </div>
        </main>
    </div>

</body>
<script src="../../../../js/iframe-resize.js"></script>
<script src="../../../../js/modal-close.js"></script>
</html>
